[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-claude"
version = "1.0.0"
description = "Multi-agent autonomous coding framework"
readme = "../../README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Auto-Claude Team"}
]
keywords = ["ai", "coding", "automation", "claude"]

dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.19",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ralph = "ralph_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ralph_cli*", "core*", "integrations*", "spec*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
